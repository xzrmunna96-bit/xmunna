<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="nodeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient background glow behind the emblem -->
  <circle cx="80" cy="80" r="54" fill="#0284c7" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Outer Orbit Circle -->
  <circle cx="80" cy="80" r="48" stroke="url(#orbitGrad)" stroke-width="1.8" fill="none"/>

  <!-- Orbital Node 1: Top (12 o'clock) -->
  <g transform="translate(80, 32)">
    <circle cx="0" cy="0" r="6" fill="#0284c7" filter="url(#nodeGlow)"/>
    <!-- Speech bubble dot indicator -->
    <circle cx="0" cy="0" r="2.2" fill="#e0f2fe"/>
    <path d="M-2 4 L0 7 L2 4 Z" fill="#0284c7"/>
  </g>

  <!-- Orbital Node 2: Bottom-Right (4 o'clock, ~121.5, 104) -->
  <g transform="translate(121.5, 104)">
    <circle cx="0" cy="0" r="6" fill="#0284c7" filter="url(#nodeGlow)"/>
    <circle cx="0" cy="0" r="2.2" fill="#e0f2fe"/>
    <path d="M-4 -1 L-7 1 L-4 3 Z" fill="#0284c7"/>
  </g>

  <!-- Orbital Node 3: Bottom-Left (8 o'clock, ~38.5, 104) -->
  <g transform="translate(38.5, 104)">
    <circle cx="0" cy="0" r="6" fill="#0284c7" filter="url(#nodeGlow)"/>
    <circle cx="0" cy="0" r="2.2" fill="#e0f2fe"/>
    <path d="M4 -1 L7 1 L4 3 Z" fill="#0284c7"/>
  </g>

  <!-- Center Stylized Glowing "N" Emblem -->
  <!-- Left upright column -->
  <path d="M 60 52 
           C 60 48.5, 63.5 46, 67 46 
           C 70.5 46, 73 48.5, 73 52 
           L 73 108 
           C 73 111.5, 69.5 114, 66 114 
           C 62.5 114, 60 111.5, 60 108 
           Z" 
        fill="url(#nGrad)" 
        filter="url(#softGlow)"/>

  <!-- Right upright column -->
  <path d="M 87 52 
           C 87 48.5, 90.5 46, 94 46 
           C 97.5 46, 100 48.5, 100 52 
           L 100 108 
           C 100 111.5, 96.5 114, 93 114 
           C 89.5 114, 87 111.5, 87 108 
           Z" 
        fill="url(#nGrad)" 
        filter="url(#softGlow)"/>

  <!-- Diagonal connection beam with sleek aerodynamic geometry -->
  <path d="M 63 53 
           L 97 97 
           C 100 101, 98 106, 93 106 
           L 89 106 
           L 61 68 
           C 58 64, 60 59, 63 53 
           Z" 
        fill="url(#nGrad)" 
        filter="url(#softGlow)"/>
</svg>
