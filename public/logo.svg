<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Speed motion trails (purple/violet streaks on left) -->
  <path d="M8 44 Q 28 42, 44 48" stroke="url(#purpleGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
  <path d="M4 56 Q 24 54, 42 60" stroke="url(#purpleGrad)" stroke-width="4" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <path d="M10 68 Q 30 66, 48 72" stroke="url(#purpleGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
  <path d="M16 80 Q 32 78, 52 82" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Left purple wing feather -->
  <path d="M22 36 C 42 32, 60 44, 66 52 C 52 50, 36 44, 22 36 Z" fill="url(#purpleGrad)" filter="url(#glow)"/>
  <path d="M14 48 C 34 46, 52 56, 58 64 C 44 60, 30 56, 14 48 Z" fill="url(#purpleGrad)"/>

  <!-- Glowing mail envelope tilted forward (flying right/up) -->
  <g transform="rotate(-12 68 62)">
    <!-- Envelope Shadow/Glow -->
    <rect x="36" y="38" width="56" height="38" rx="7" fill="#4c1d95" opacity="0.6" filter="url(#glow)"/>
    
    <!-- Envelope Body (Gold/Yellow) -->
    <rect x="38" y="40" width="54" height="36" rx="6" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5"/>
    
    <!-- Envelope Back Flap Creases -->
    <path d="M38 76 L 65 57 L 92 76" stroke="#92400e" stroke-width="1.5" fill="none" opacity="0.7"/>
    
    <!-- Top Flap (Open / Folded V) -->
    <path d="M38 40 L 65 60 L 92 40" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2" opacity="0.95"/>
    <path d="M42 42 L 65 58 L 88 42" fill="url(#goldGrad)" opacity="0.85"/>

    <!-- Shiny Speed Highlights -->
    <line x1="42" y1="46" x2="52" y2="46" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="86" cy="46" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Forward motion spark / star -->
  <polygon points="106,38 108,44 114,46 108,48 106,54 104,48 98,46 104,44" fill="#fde047" filter="url(#glow)"/>
  <circle cx="106" cy="46" r="1.5" fill="#ffffff"/>
  <circle cx="114" cy="62" r="1" fill="#38bdf8"/>
</svg>
